name: Clippy Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run backend tests
        run: pytest tests/ -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build frontend
        working-directory: dashboard
        run: |
          npm ci
          npm run build


  build-python-runtimes:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "${{ matrix.variant }}"

      - name: Retain runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-${{ matrix.variant }}
          path: |
            desktop/runtime-dist/clippy-python-${{ matrix.variant }}.zip
            desktop/runtime-dist/clippy-python-${{ matrix.variant }}.zip.sha256
          if-no-files-found: error
          retention-days: 2

  build-and-publish:
    needs: [validate, build-python-runtimes]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        shell: pwsh
        run: ./desktop/validate-version.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Download verified Python runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: clippy-python-runtime-*
          path: desktop/runtime-dist
          merge-multiple: true

      - name: Validate runtime package assets
        shell: pwsh
        run: |
          foreach ($variant in @("cpu", "cuda")) {
            $archive = "./desktop/runtime-dist/clippy-python-$variant.zip"
            $checksum = "$archive.sha256"
            if (-not (Test-Path $archive) -or -not (Test-Path $checksum)) {
              throw "Missing $variant Python runtime release assets."
            }
            $line = Get-Content $checksum -Raw
            if ($line -notmatch "(?i)\b([a-f0-9]{64})\b") { throw "Invalid checksum for $archive" }
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1].ToLowerInvariant()) { throw "Checksum mismatch for $archive" }
          }

      - name: Build NSIS installer
        shell: pwsh
        run: ./desktop/build.ps1

      - name: Generate SHA256 checksum
        id: installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($files.Count)." }
          $installer = $files[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -Encoding ascii
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($installer.Name)"
          Write-Host "SHA256 $hash"

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: Clippy
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
            desktop/runtime-dist/*.zip
            desktop/runtime-dist/*.zip.sha256
