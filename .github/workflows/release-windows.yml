name: Clippy Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install backend test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run backend tests
        run: pytest tests/ -v
      - name: Require Community Highlights public OAuth client IDs
        env:
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          for name in CLIPPY_TWITCH_CLIENT_ID CLIPPY_GOOGLE_OAUTH_CLIENT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing repository Actions Variable $name. Configure the public OAuth client ID before creating a release."
              exit 1
            fi
            if [ "${#value}" -gt 512 ] || [[ ! "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Repository Actions Variable $name has an invalid value."
              exit 1
            fi
          done
          echo "Community Highlights public OAuth client IDs are configured."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build frontend
        working-directory: dashboard
        run: |
          npm ci
          npm run build


  validate-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Each Actions job starts with an empty workspace. This job reads the tagged
      # Tauri config and runs a validator stored in that exact tagged source.
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Require Tauri updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret."
            exit 1
          fi
          echo "Required Tauri updater signing secrets are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign

      - name: Install Tauri CLI signer
        run: npm install --global --no-audit --no-fund @tauri-apps/cli@2.12.5

      - name: Validate configured updater public key
        run: node desktop/validate-updater-signing-key.mjs "$RUNNER_TEMP/clippy-updater.pub"

      - name: Prove release private key matches configured public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          probe="$(mktemp "$RUNNER_TEMP/clippy-updater-signing-probe.XXXXXX")"
          minisign_signature="$(mktemp "$RUNNER_TEMP/clippy-updater-signature.XXXXXX")"
          public_key="$RUNNER_TEMP/clippy-updater.pub"
          trap 'rm -f "$probe" "$probe.sig" "$minisign_signature" "$public_key"' EXIT

          printf '%s\n' 'Clippy updater signing preflight' > "$probe"
          tauri signer sign --app-version 0.0.0 "$probe"
          test -s "$probe.sig"
          base64 --decode "$probe.sig" > "$minisign_signature"
          test -s "$minisign_signature"
          minisign -Vm "$probe" -p "$public_key" -x "$minisign_signature"
          echo "Tauri updater private key successfully signed a probe verified by the configured public key."

  build-python-runtimes:
    needs: [validate, validate-signing]
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate runtime build version against release tag
        shell: pwsh
        run: ./desktop/validate-version.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "${{ matrix.variant }}"

      - name: Retain runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-${{ matrix.variant }}
          path: desktop/runtime-dist/clippy-python-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 2

  build-and-publish:
    needs: [validate, validate-signing, build-python-runtimes]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        shell: pwsh
        run: ./desktop/validate-version.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Download verified Python runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: clippy-python-runtime-*
          path: desktop/runtime-dist
          merge-multiple: true

      - name: Validate runtime manifests, parts, and reconstructed archives
        shell: pwsh
        run: ./desktop/validate-runtime-assets.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Build signed NSIS updater installer and assemble application payload
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: ./desktop/build.ps1 -CreateUpdaterArtifacts

      # The payload contract tests must run after prepare-payload.ps1 has built
      # the exact ZIP embedded in the installer, not against source files alone.
      - name: Run PowerShell runtime and assembled-payload contract tests
        shell: pwsh
        env:
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path ./desktop/tests -CI

      # Exercise setup-runtime.ps1 itself against the packaged app ZIP and the
      # CPU runtime built in this same release run, using an isolated LOCALAPPDATA.
      # This catches bootstrap/download/dependency integration failures before
      # an installer can be published.
      - name: Smoke-test clean first-run runtime setup
        shell: pwsh
        timeout-minutes: 30
        run: ./desktop/smoke-test-runtime.ps1

      - name: Run Rust unit and installer contract tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Sign Windows installer (optional)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          $files = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($files.Count)." }

          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)

          if (-not $hasCertificate -and -not $hasPassword) {
            Write-Warning "No Authenticode certificate configured. Continuing with an unsigned installer; Tauri updater signing remains mandatory."
            exit 0
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw "Both code-signing secrets must be configured together. Remove the incomplete secret or provide both."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "clippy-code-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found on the release runner." }
          try {
            & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $files[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the installer (exit $LASTEXITCODE)." }
            & $signtool.FullName verify /pa /v $files[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Signed installer verification failed (exit $LASTEXITCODE)." }
            Write-Host "Installer Authenticode signature verified."
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Re-sign final installer for Tauri updater
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installerFiles.Count)." }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          cargo tauri signer sign --app-version $version $installerFiles[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed (exit $LASTEXITCODE)." }

          $signaturePath = "$($installerFiles[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw "Tauri updater signature was not generated: $signaturePath" }
          if ((Get-Item -LiteralPath $signaturePath).Length -le 0) { throw "Tauri updater signature is empty: $signaturePath" }
          Write-Host "Final installer signature regenerated after optional Authenticode signing."

      - name: Generate SHA256 checksum
        id: installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($files.Count)." }
          $installer = $files[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -Encoding ascii
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($installer.Name)"
          Write-Host "SHA256 $hash"

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: Clippy ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
            desktop/runtime-dist/clippy-python-*

      - name: Generate and upload signed updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installerFiles.Count)." }

          $notesPath = Join-Path $env:RUNNER_TEMP "clippy-release-notes.md"
          # Draft releases are not reliably returned by the release-by-tag endpoint.
          # Resolve the draft through the releases collection, as the verification
          # step below does, then use the body generated by action-gh-release.
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases to read generated draft notes." }
          $releases = @($releasesJson | ConvertFrom-Json)
          $draftRelease = $releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME -and $_.draft } | Select-Object -First 1
          if (-not $draftRelease) { throw "Could not find the generated draft release for tag $env:GITHUB_REF_NAME." }
          [System.IO.File]::WriteAllText($notesPath, [string]$draftRelease.body, [System.Text.UTF8Encoding]::new($false))

          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          ./desktop/create-updater-manifest.ps1 -ReleaseTag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY -InstallerPath $installerFiles[0].FullName -SignaturePath "$($installerFiles[0].FullName).sig" -ReleaseNotesPath $notesPath -OutputPath $manifestPath
          if ($LASTEXITCODE -ne 0) { throw "Updater manifest generation failed." }

          gh release upload "$env:GITHUB_REF_NAME" $manifestPath --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload latest.json to the draft release." }

      - name: Verify draft release assets before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) { throw "Expected exactly one installer when verifying the draft release." }
          $signatureFile = Get-Item "$($installerFiles[0].FullName).sig"
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Generated updater manifest is missing." }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($manifest.version -ne $expectedVersion) { throw "Updater manifest version does not match the release tag." }
          $signatureContent = (Get-Content -LiteralPath $signatureFile.FullName -Raw -Encoding UTF8).Trim()
          if ($manifest.platforms.'windows-x86_64'.signature -ne $signatureContent) { throw "Updater manifest signature does not match the final installer signature." }
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$([System.Uri]::EscapeDataString($installerFiles[0].Name))"
          if ($manifest.platforms.'windows-x86_64'.url -ne $expectedUrl) { throw "Updater manifest installer URL is incorrect." }

          $expectedFiles = @($installerFiles[0], $signatureFile, (Get-Item "$($installerFiles[0].FullName).sha256"), (Get-Item $manifestPath)) +
            @(Get-ChildItem "./desktop/runtime-dist" -File -Filter "clippy-python-*")
          $expected = @{}
          foreach ($file in $expectedFiles) { $expected[$file.Name] = [long]$file.Length }

          # Draft releases may not be discoverable through the tag lookup endpoint immediately.
          # List releases by ID and select the exact tag instead.
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not list repository releases." }
          $releases = @($releasesJson | ConvertFrom-Json)
          $release = $releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Select-Object -First 1
          if (-not $release) { throw "Could not find the newly created draft release for tag $env:GITHUB_REF_NAME." }
          if (-not $release.draft) { throw "Release was published before asset verification; expected a draft." }

          $actual = @{}
          foreach ($asset in @($release.assets)) { $actual[$asset.name] = [long]$asset.size }
          foreach ($name in $expected.Keys) {
            if (-not $actual.ContainsKey($name)) { throw "Draft release is missing required asset: $name" }
            if ($actual[$name] -ne $expected[$name]) {
              throw "Draft release asset size mismatch for $name. Expected $($expected[$name]), got $($actual[$name])."
            }
          }
          Write-Host "Verified the installer, Tauri signature, updater manifest, checksum, and runtime assets on draft release $env:GITHUB_REF_NAME."

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease
          } else {
            gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified draft release with the correct latest-release policy." }
          Write-Host "Published verified Clippy release $env:GITHUB_REF_NAME."
