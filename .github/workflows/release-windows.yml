name: Clippy Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install backend test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run backend tests
        run: pytest tests/ -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build frontend
        working-directory: dashboard
        run: |
          npm ci
          npm run build


  build-python-runtimes:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "${{ matrix.variant }}"

      - name: Retain runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-${{ matrix.variant }}
          path: desktop/runtime-dist/clippy-python-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 2

  build-and-publish:
    needs: [validate, build-python-runtimes]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        shell: pwsh
        run: ./desktop/validate-version.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Verify public release signing credentials
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)) {
            throw "Public Windows releases require both Authenticode signing secrets. Configure them before creating a release tag."
          }

      - name: Download verified Python runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: clippy-python-runtime-*
          path: desktop/runtime-dist
          merge-multiple: true

      - name: Validate runtime manifests, parts, and reconstructed archives
        shell: pwsh
        run: ./desktop/validate-runtime-assets.ps1 -ExpectedVersion "$env:GITHUB_REF_NAME"

      - name: Run PowerShell runtime contract tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path ./desktop/tests -CI

      - name: Run Rust unit and installer contract tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build NSIS installer
        shell: pwsh
        run: ./desktop/build.ps1

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          $files = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($files.Count)." }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)) {
            throw "Public Windows releases must be Authenticode-signed. Configure WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64 and WINDOWS_CODESIGN_CERTIFICATE_PASSWORD before creating a release tag."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD)) {
            throw "The code-signing certificate is configured but its password secret is missing."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "clippy-code-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $signtool = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found on the release runner." }
          try {
            & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 $files[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the installer (exit $LASTEXITCODE)." }
            & $signtool.FullName verify /pa /v $files[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Signed installer verification failed (exit $LASTEXITCODE)." }
            Write-Host "Installer Authenticode signature verified."
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate SHA256 checksum
        id: installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($files.Count)." }
          $installer = $files[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -Encoding ascii
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($installer.Name)"
          Write-Host "SHA256 $hash"

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          name: Clippy
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
            desktop/runtime-dist/clippy-python-*
      
      - name: Verify draft release assets before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) { throw "Expected exactly one installer when verifying the draft release." }
          $expectedFiles = @($installerFiles[0], (Get-Item "$($installerFiles[0].FullName).sha256")) +
            @(Get-ChildItem "./desktop/runtime-dist" -File -Filter "clippy-python-*")
          $expected = @{}
          foreach ($file in $expectedFiles) { $expected[$file.Name] = [long]$file.Length }

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not read the newly created draft release." }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.draft) { throw "Release was published before asset verification; expected a draft." }

          $actual = @{}
          foreach ($asset in @($release.assets)) { $actual[$asset.name] = [long]$asset.size }
          foreach ($name in $expected.Keys) {
            if (-not $actual.ContainsKey($name)) { throw "Draft release is missing required asset: $name" }
            if ($actual[$name] -ne $expected[$name]) {
              throw "Draft release asset size mismatch for $name. Expected $($expected[$name]), got $($actual[$name])."
            }
          }
          Write-Host "Verified $($expected.Count) installer/runtime release assets on draft release $env:GITHUB_REF_NAME."

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the verified draft release." }
          Write-Host "Published verified Clippy release $env:GITHUB_REF_NAME."
