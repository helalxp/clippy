name: Windows desktop validation

# New commits supersede older validation runs for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-runtime-changes:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.detect.outputs.runtime_changed }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python runtime package changes
        id: detect
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -or
              [string]::IsNullOrWhiteSpace($env:BASE_SHA) -or
              $env:BASE_SHA -eq "0000000000000000000000000000000000000000") {
            "runtime_changed=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changedPaths = @(git diff --name-only $env:BASE_SHA $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw "Could not compare the runtime inputs." }

          $runtimePatterns = @(
            '^desktop/build-python-runtime\.ps1$',
            '^desktop/runtime-contract\.json$',
            '^desktop/runtime-dist/',
            '^requirements[^/]*\.txt$',
            '^requirements/'
          )

          $runtimeChanged = $false
          foreach ($path in $changedPaths) {
            foreach ($pattern in $runtimePatterns) {
              if ($path -match $pattern) { $runtimeChanged = $true }
            }
          }

          "runtime_changed=$($runtimeChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Python runtime rebuild required: $runtimeChanged"

  validate-windows:
    needs: [detect-runtime-changes, build-python-runtime-cpu]
    if: ${{ always() && needs.detect-runtime-changes.result == 'success' && (needs.build-python-runtime-cpu.result == 'success' || needs.build-python-runtime-cpu.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate synchronized application version
        shell: pwsh
        run: |
          ./desktop/set-version.ps1 -Check
          ./desktop/validate-version.ps1

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run dashboard unit tests
        working-directory: dashboard
        run: npm test

      - name: Build desktop dashboard
        shell: pwsh
        run: ./dashboard/build-desktop.ps1

      - name: Validate shared Community Highlights OAuth IDs
        shell: pwsh
        env:
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          $google = ([string]$env:CLIPPY_GOOGLE_OAUTH_CLIENT_ID).Trim()
          $twitch = ([string]$env:CLIPPY_TWITCH_CLIENT_ID).Trim()

          if ([string]::IsNullOrWhiteSpace($google)) {
            throw "Missing CLIPPY_GOOGLE_OAUTH_CLIENT_ID repository Actions Variable."
          }

          foreach ($entry in @(
            @{ Name = "Google"; Value = $google },
            @{ Name = "Twitch"; Value = $twitch }
          )) {
            $value = [string]$entry.Value
            if ($value.Length -gt 512 -or ($value -and $value -match '[^A-Za-z0-9._-]')) {
              throw "$($entry.Name) OAuth Client ID has an invalid format."
            }
          }

          Write-Host "Google OAuth Client ID is configured."
          Write-Host "Twitch OAuth Client ID configured: $(-not [string]::IsNullOrWhiteSpace($twitch))"

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./desktop/set-version.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/prepare-payload.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/setup-runtime.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/storage-path.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/smoke-test-runtime.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/build.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/create-updater-manifest.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/build-python-runtime.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/runtime-archive.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/runtime-manifest-state.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/runtime-health.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/runtime-ffmpeg.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/test-runtime-contract.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/validate-runtime-assets.ps1 -Raw)) | Out-Null
          Get-Content ./desktop/src-tauri/tauri.updater.conf.json -Raw | ConvertFrom-Json | Out-Null

      - name: Prepare packaged backend and renderer payload
        shell: pwsh
        env:
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: ./desktop/prepare-payload.ps1

      # PayloadContract.Tests.ps1 opens the real ZIP produced above. Running the
      # suite earlier would only test source files and miss packaging omissions.
      - name: Run PowerShell runtime and assembled-payload contract tests
        shell: pwsh
        env:
          CLIPPY_TWITCH_CLIENT_ID: ${{ vars.CLIPPY_TWITCH_CLIENT_ID }}
          CLIPPY_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CLIPPY_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path ./desktop/tests -CI

      - name: Download CPU runtime for clean first-run smoke test
        if: needs.detect-runtime-changes.outputs.runtime_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: clippy-python-runtime-cpu
          path: desktop/runtime-dist

      - name: Smoke-test clean first-run runtime setup
        if: needs.detect-runtime-changes.outputs.runtime_changed == 'true'
        shell: pwsh
        timeout-minutes: 30
        run: ./desktop/smoke-test-runtime.ps1

      - name: Check backend Python syntax
        run: python -m compileall -q .

      - name: Smoke-test Windows Whisper model locking and promotion
        run: python tests/windows_whisper_model_lifecycle_smoke.py

      - name: Check Tauri Rust application
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust unit and manifest compatibility tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build complete NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
            if ($LASTEXITCODE -ne 0) { throw "Tauri CLI installation failed." }
          }
          Push-Location ./desktop/src-tauri
          try {
            cargo tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed." }
          } finally {
            Pop-Location
          }

      - name: Measure installer and embedded application payload
        id: build-size
        shell: pwsh
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installerFiles.Count)."
          }
          $installer = $installerFiles[0]
          $payload = Get-Item "./desktop/src-tauri/resources/app-payload.zip"
          $installerMB = [math]::Round($installer.Length / 1MB, 2)
          $payloadMB = [math]::Round($payload.Length / 1MB, 2)
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = @(
            "Clippy Windows build size report"
            "Commit: $env:GITHUB_SHA"
            "Version: $((Get-Content ./VERSION -Raw).Trim())"
            "Installer: $($installer.Name)"
            "Installer bytes: $($installer.Length)"
            "Installer MiB: $installerMB"
            "Installer SHA-256: $installerHash"
            "Embedded application payload bytes: $($payload.Length)"
            "Embedded application payload MiB: $payloadMB"
            "Note: first-run Python, PyTorch, Node, FFmpeg, and Remotion browser downloads are not included in this installer size."
          )
          $reportPath = Join-Path $env:RUNNER_TEMP "clippy-build-size-report.txt"
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          Write-Host ($report -join [Environment]::NewLine)

      - name: Retain installer for manual size and smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-installer-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/clippy-build-size-report.txt
          if-no-files-found: error
          retention-days: 7

  build-python-runtime-cpu:
    needs: detect-runtime-changes
    if: needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "cpu"

      - name: Retain tested runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-cpu
          path: desktop/runtime-dist/clippy-python-cpu*
          if-no-files-found: error
          retention-days: 7

  build-python-runtime-cuda:
    needs: detect-runtime-changes
    if: needs.detect-runtime-changes.outputs.runtime_changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "cuda"

      - name: Retain tested runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-cuda
          path: desktop/runtime-dist/clippy-python-cuda*
          if-no-files-found: error
          retention-days: 7

