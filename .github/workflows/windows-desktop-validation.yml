name: Windows desktop validation

on:
  push:
    branches:
      - windows-installer-release
  pull_request:
    branches:
      - windows-installer-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate synchronized application version
        shell: pwsh
        run: ./desktop/validate-version.ps1

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build desktop dashboard
        shell: pwsh
        run: ./dashboard/build-desktop.ps1

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./desktop/prepare-payload.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/setup-runtime.ps1 -Raw)) | Out-Null

      - name: Prepare packaged backend and renderer payload
        shell: pwsh
        run: ./desktop/prepare-payload.ps1

      - name: Check backend Python syntax
        run: python -m compileall -q .

      - name: Check Tauri Rust application
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build complete NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
            if ($LASTEXITCODE -ne 0) { throw "Tauri CLI installation failed." }
          }
          Push-Location ./desktop/src-tauri
          try {
            cargo tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed." }
          } finally {
            Pop-Location
          }
