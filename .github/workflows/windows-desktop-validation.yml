name: Windows desktop validation

on:
  push:
    branches:
      - windows-installer-release
      - windows-installer-hardening
  pull_request:
    branches:
      - windows-installer-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate synchronized application version
        shell: pwsh
        run: ./desktop/validate-version.ps1

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build desktop dashboard
        shell: pwsh
        run: ./dashboard/build-desktop.ps1

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content ./desktop/prepare-payload.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/setup-runtime.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/build-python-runtime.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/runtime-archive.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./desktop/validate-runtime-assets.ps1 -Raw)) | Out-Null
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path ./desktop/tests -CI

      - name: Prepare packaged backend and renderer payload
        shell: pwsh
        run: ./desktop/prepare-payload.ps1

      - name: Check backend Python syntax
        run: python -m compileall -q .

      - name: Check Tauri Rust application
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust unit and manifest compatibility tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build complete NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
            if ($LASTEXITCODE -ne 0) { throw "Tauri CLI installation failed." }
          }
          Push-Location ./desktop/src-tauri
          try {
            cargo tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed." }
          } finally {
            Pop-Location
          }

      - name: Measure installer and embedded application payload
        id: build-size
        shell: pwsh
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installerFiles.Count)."
          }
          $installer = $installerFiles[0]
          $payload = Get-Item "./desktop/src-tauri/resources/app-payload.zip"
          $installerMB = [math]::Round($installer.Length / 1MB, 2)
          $payloadMB = [math]::Round($payload.Length / 1MB, 2)
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = @(
            "Clippy Windows build size report"
            "Commit: $env:GITHUB_SHA"
            "Version: $((Get-Content ./VERSION -Raw).Trim())"
            "Installer: $($installer.Name)"
            "Installer bytes: $($installer.Length)"
            "Installer MiB: $installerMB"
            "Installer SHA-256: $installerHash"
            "Embedded application payload bytes: $($payload.Length)"
            "Embedded application payload MiB: $payloadMB"
            "Note: first-run Python, PyTorch, Node, FFmpeg, and Remotion browser downloads are not included in this installer size."
          )
          $reportPath = Join-Path $env:RUNNER_TEMP "clippy-build-size-report.txt"
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          Write-Host ($report -join [Environment]::NewLine)

      - name: Retain installer for manual size and smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-installer-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/clippy-build-size-report.txt
          if-no-files-found: error
          retention-days: 7

  build-python-runtime:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "${{ matrix.variant }}"

      - name: Retain tested runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-${{ matrix.variant }}
          path: desktop/runtime-dist/clippy-python-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 7

