name: Windows desktop validation

on:
  push:
    branches:
      - windows-installer-release
      - windows-installer-hardening
  pull_request:
    branches:
      - windows-installer-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse installer and test scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scripts = @(
            "./desktop/build.ps1",
            "./desktop/build-python-runtime.ps1",
            "./desktop/prepare-payload.ps1",
            "./desktop/setup-runtime.ps1",
            "./desktop/smoke-test-runtime.ps1",
            "./desktop/runtime-archive.ps1",
            "./desktop/runtime-manifest-state.ps1",
            "./desktop/validate-runtime-assets.ps1",
            "./desktop/validate-version.ps1",
            "./dashboard/build-desktop.ps1"
          ) + @(Get-ChildItem "./desktop/tests" -Filter "*.Tests.ps1" -File | ForEach-Object { $_.FullName })

          foreach ($path in $scripts) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "PowerShell preflight script was not found: $path"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $details = @($parseErrors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }) -join [Environment]::NewLine
              throw ("Windows PowerShell 5.1 could not parse " + $path + ":" + [Environment]::NewLine + $details)
            }
            Write-Host "Windows PowerShell 5.1 parse OK: $path"
          }

      - name: Run runtime helper unit contracts before package builds
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path @(
            "./desktop/tests/RuntimeArchive.Tests.ps1",
            "./desktop/tests/RuntimeManifestState.Tests.ps1"
          ) -CI

  validate-windows:
    needs: [powershell-preflight, build-python-runtime]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            render-service/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate synchronized application version
        shell: pwsh
        run: ./desktop/validate-version.ps1

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build desktop dashboard
        shell: pwsh
        run: ./dashboard/build-desktop.ps1

      - name: Prepare packaged backend and renderer payload
        shell: pwsh
        run: ./desktop/prepare-payload.ps1

      # PayloadContract.Tests.ps1 opens the real ZIP produced above. Running the
      # suite earlier would only test source files and miss packaging omissions.
      - name: Run PowerShell runtime and assembled-payload contract tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          Invoke-Pester -Path ./desktop/tests -CI

      - name: Download CPU runtime for clean first-run smoke test
        uses: actions/download-artifact@v4
        with:
          name: clippy-python-runtime-cpu
          path: desktop/runtime-dist

      - name: Smoke-test clean first-run runtime setup
        shell: pwsh
        timeout-minutes: 30
        run: ./desktop/smoke-test-runtime.ps1

      - name: Retain first-run runtime setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-first-run-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clippy-first-run-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Check backend Python syntax
        run: python -m compileall -q .

      - name: Check Tauri Rust application
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Rust unit and manifest compatibility tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build complete NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
            if ($LASTEXITCODE -ne 0) { throw "Tauri CLI installation failed." }
          }
          Push-Location ./desktop/src-tauri
          try {
            cargo tauri build --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed." }
          } finally {
            Pop-Location
          }

      - name: Measure installer and embedded application payload
        id: build-size
        shell: pwsh
        run: |
          $installerFiles = @(Get-ChildItem "./desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installerFiles.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installerFiles.Count)."
          }
          $installer = $installerFiles[0]
          $payload = Get-Item "./desktop/src-tauri/resources/app-payload.zip"
          $installerMB = [math]::Round($installer.Length / 1MB, 2)
          $payloadMB = [math]::Round($payload.Length / 1MB, 2)
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = @(
            "Clippy Windows build size report"
            "Commit: $env:GITHUB_SHA"
            "Version: $((Get-Content ./VERSION -Raw).Trim())"
            "Installer: $($installer.Name)"
            "Installer bytes: $($installer.Length)"
            "Installer MiB: $installerMB"
            "Installer SHA-256: $installerHash"
            "Embedded application payload bytes: $($payload.Length)"
            "Embedded application payload MiB: $payloadMB"
            "Note: first-run Python, PyTorch, Node, FFmpeg, and Remotion browser downloads are not included in this installer size."
          )
          $reportPath = Join-Path $env:RUNNER_TEMP "clippy-build-size-report.txt"
          $report | Set-Content -LiteralPath $reportPath -Encoding utf8
          $report | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $_ }
          "report_path=$reportPath" >> $env:GITHUB_OUTPUT
          Write-Host ($report -join [Environment]::NewLine)

      - name: Retain installer for manual size and smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: clippy-windows-installer-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/clippy-build-size-report.txt
          if-no-files-found: error
          retention-days: 7

  build-python-runtime:
    needs: [powershell-preflight]
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 build tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and validate relocatable Python runtime
        shell: pwsh
        run: ./desktop/build-python-runtime.ps1 -Variant "${{ matrix.variant }}"

      - name: Retain tested runtime package
        uses: actions/upload-artifact@v4
        with:
          name: clippy-python-runtime-${{ matrix.variant }}
          path: desktop/runtime-dist/clippy-python-${{ matrix.variant }}*
          if-no-files-found: error
          retention-days: 7

